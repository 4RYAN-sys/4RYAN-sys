<svg width="760" height="240" viewBox="0 0 760 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="4RYAN-sys terminal header banner">
  <defs>
    <style>
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes sweep { 0% { transform: translateY(-20px); opacity: 0; } 10% { opacity: .9; } 90% { opacity: .9; } 100% { transform: translateY(240px); opacity: 0; } }
      @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .55; } }
      .blink { animation: blink 1.1s step-end infinite; }
      .sweep { animation: sweep 4s linear infinite; }
      .twinkle { animation: twinkle 3s ease-in-out infinite; }
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Mono', 'SF Mono', Consolas, monospace; }
      text { user-select: none; }
    </style>
  </defs>

  <!-- panel background -->
  <rect x="0" y="0" width="760" height="240" rx="10" fill="#0d1117" opacity="0.6"/>

  <!-- matrix rain columns -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="14">
    <g>
      <text x="40"  y="14" fill="#22d3ee">1</text>
      <text x="40"  y="28" fill="#22d3ee">0</text>
      <text x="40"  y="42" fill="#facc15">1</text>
      <text x="40"  y="56" fill="#22d3ee">0</text>
      <text x="40"  y="70" fill="#22d3ee">1</text>
      <text x="40"  y="84" fill="#22d3ee">0</text>
      <text x="40"  y="98" fill="#22d3ee">1</text>
      <text x="40"  y="112" fill="#22d3ee">0</text>
      <text x="40"  y="126" fill="#22d3ee">1</text>
      <text x="40"  y="140" fill="#22d3ee">1</text>
      <text x="40"  y="154" fill="#facc15">0</text>
      <text x="40"  y="168" fill="#22d3ee">0</text>
      <text x="40"  y="182" fill="#22d3ee">1</text>
      <text x="40"  y="196" fill="#22d3ee">0</text>
      <text x="40"  y="210" fill="#22d3ee">1</text>
      <text x="40"  y="224" fill="#22d3ee">0</text>
      <text x="40"  y="238" fill="#22d3ee">1</text>
      <animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="120" y="14" fill="#22d3ee">0</text>
      <text x="120" y="28" fill="#22d3ee">1</text>
      <text x="120" y="42" fill="#22d3ee">1</text>
      <text x="120" y="56" fill="#22d3ee">0</text>
      <text x="120" y="70" fill="#facc15">0</text>
      <text x="120" y="84" fill="#22d3ee">1</text>
      <text x="120" y="98" fill="#22d3ee">0</text>
      <text x="120" y="112" fill="#22d3ee">1</text>
      <text x="120" y="126" fill="#22d3ee">0</text>
      <text x="120" y="140" fill="#22d3ee">1</text>
      <text x="120" y="154" fill="#22d3ee">1</text>
      <text x="120" y="168" fill="#22d3ee">0</text>
      <text x="120" y="182" fill="#22d3ee">0</text>
      <text x="120" y="196" fill="#22d3ee">1</text>
      <text x="120" y="210" fill="#22d3ee">0</text>
      <text x="120" y="224" fill="#22d3ee">1</text>
      <text x="120" y="238" fill="#facc15">0</text>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite" begin="1s"/>
    </g>
    <g>
      <text x="660" y="14" fill="#22d3ee">0</text>
      <text x="660" y="28" fill="#22d3ee">1</text>
      <text x="660" y="42" fill="#22d3ee">0</text>
      <text x="660" y="56" fill="#22d3ee">1</text>
      <text x="660" y="70" fill="#22d3ee">0</text>
      <text x="660" y="84" fill="#facc15">1</text>
      <text x="660" y="98" fill="#22d3ee">0</text>
      <text x="660" y="112" fill="#22d3ee">1</text>
      <text x="660" y="126" fill="#22d3ee">0</text>
      <text x="660" y="140" fill="#22d3ee">0</text>
      <text x="660" y="154" fill="#22d3ee">1</text>
      <text x="660" y="168" fill="#22d3ee">1</text>
      <text x="660" y="182" fill="#22d3ee">0</text>
      <text x="660" y="196" fill="#22d3ee">1</text>
      <text x="660" y="210" fill="#22d3ee">0</text>
      <text x="660" y="224" fill="#22d3ee">1</text>
      <text x="660" y="238" fill="#facc15">0</text>
      <animate attributeName="opacity" values="0;0.85;0" dur="6s" repeatCount="indefinite" begin="2s"/>
    </g>
  </g>

  <!-- radar spinner -->
  <g transform="translate(36,64)" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="30" y2="0" stroke="#22d3ee" stroke-width="1.5"/>
      <circle cx="30" cy="0" r="3" fill="#22d3ee"/>
    </g>
    <circle r="22" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
    <circle r="15" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
    <circle r="8" fill="#facc15" opacity="0.3"/>
    <circle r="22" fill="none" stroke="#facc15" stroke-width="1" opacity="0.5"/>
    <circle r="15" fill="none" stroke="#facc15" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- name block -->
  <g font-family="ui-monospace,'JetBrains Mono','Cascadia Mono',monospace">
    <text x="84" y="42" font-size="13" fill="#8b949e" letter-spacing="0.5">$ whoami --profile</text>
    <text x="84" y="78" font-size="34" fill="#c9d1d9">4RYAN<tspan fill="#facc15">-sys</tspan></text>
    <text x="84" y="102" font-size="12" letter-spacing="2" fill="#22d3ee">// SYSTEM.INIT()<tspan class="blink" fill="#22d3ee">_</tspan></text>

    <text x="84" y="138" font-size="13" fill="#8b949e">┌── AVARITIA <tspan fill="#facc15">::</tspan> RPL UNIT ──╼ ▛ INIT ▜</text>
    <text x="84" y="158" font-size="13" fill="#8b949e">├─▣ mode   <tspan fill="#22d3ee">::</tspan> fullstack + iot</text>
    <text x="84" y="178" font-size="13" fill="#8b949e">├─▣ shell  <tspan fill="#22d3ee">::</tspan> github-profile v2.1<tspan class="twinkle" fill="#22d3ee">▮</tspan></text>
    <text x="84" y="198" font-size="13" fill="#8b949e">└─▣ status <tspan fill="#22d3ee">::</tspan> online <tspan fill="#22d3ee">[ OK ]</tspan></text>
  </g>

  <!-- scanline sweep -->
  <rect class="sweep" x="0" y="0" width="760" height="2" fill="#22d3ee" opacity="0" rx="1"/>

  <!-- border glow -->
  <rect x="1" y="1" width="758" height="238" rx="9" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.25"/>
</svg>
