<svg width="760" height="240" viewBox="0 0 760 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="4RYAN-sys profile banner">
  <defs>
    <style>
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }
      @keyframes gradientShift { 0% { stop-color: #0ea5e9; } 50% { stop-color: #22d3ee; } 100% { stop-color: #0ea5e9; } }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .orbit { animation: orbit 20s linear infinite; }
      .twinkle { animation: twinkle 2.5s ease-in-out infinite; }
      .shimmer { animation: shimmer 3s ease-in-out infinite; }
      text { user-select: none; font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Mono', monospace; }
    </style>
    <!-- Main gradient for border glow -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"><animate attributeName="stop-color" values="#0ea5e9;#22d3ee;#0ea5e9" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#64748b"><animate attributeName="stop-color" values="#64748b;#facc15;#64748b" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#facc15"><animate attributeName="stop-color" values="#facc15;#22d3ee;#facc15" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <!-- Background radial gradients -->
    <radialGradient id="bgGlow1" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <!-- Shimmer gradient for text -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9d1d9"/>
      <stop offset="50%" stop-color="#facc15"><animate attributeName="offset" values="-1;0;1" dur="3s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <!-- Corner ornament gradient -->
    <linearGradient id="cornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <!-- Particle gradient -->
    <radialGradient id="particleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layered background glows -->
  <rect x="0" y="0" width="760" height="240" rx="16" fill="url(#bgGlow3)"/>
  <rect x="0" y="0" width="760" height="240" rx="16" fill="url(#bgGlow1)"/>
  <rect x="0" y="0" width="760" height="240" rx="16" fill="url(#bgGlow2)"/>
  <rect x="0" y="0" width="760" height="240" rx="16" fill="#0d1117"/>

  <!-- Floating particles -->
  <g opacity="0.6">
    <circle cx="60" cy="40" r="1.5" fill="url(#particleGrad)">
      <animate attributeName="cy" values="40;32;40" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="180" r="1" fill="#facc15">
      <animate attributeName="cx" values="140;148;140" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="30" r="2" fill="#22d3ee">
      <animate attributeName="cy" values="30;22;30" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="200" r="1.5" fill="#facc15">
      <animate attributeName="cx" values="420;412;420" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="50" r="1" fill="#22d3ee">
      <animate attributeName="cy" values="50;58;50" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="160" r="1.5" fill="#facc15">
      <animate attributeName="cx" values="700;692;700" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="120" r="1" fill="#22d3ee" class="twinkle"/>
    <circle cx="320" cy="80" r="1" fill="#facc15" class="twinkle" style="animation-delay: 1s"/>
    <circle cx="500" cy="140" r="1" fill="#22d3ee" class="twinkle" style="animation-delay: 0.5s"/>
    <circle cx="650" cy="100" r="1" fill="#facc15" class="twinkle" style="animation-delay: 1.5s"/>
  </g>

  <!-- Subtle grid pattern -->
  <g stroke="#22d3ee" stroke-width="0.3" opacity="0.04">
    <line x1="0" y1="40" x2="760" y2="40"/>
    <line x1="0" y1="80" x2="760" y2="80"/>
    <line x1="0" y1="120" x2="760" y2="120"/>
    <line x1="0" y1="160" x2="760" y2="160"/>
    <line x1="0" y1="200" x2="760" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="240"/>
    <line x1="400" y1="0" x2="400" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="240"/>
    <line x1="560" y1="0" x2="560" y2="240"/>
    <line x1="640" y1="0" x2="640" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
  </g>

  <!-- Corner ornaments (elegant decorative corners) -->
  <g stroke="url(#cornerGrad)" stroke-width="1.5" fill="none" opacity="0.8">
    <!-- Top-left -->
    <path d="M 24 16 L 24 40 M 24 16 L 48 16" stroke-linecap="round"/>
    <circle cx="24" cy="16" r="3" fill="url(#cornerGrad)" opacity="0.6"/>
    <!-- Top-right -->
    <path d="M 736 16 L 736 40 M 736 16 L 712 16" stroke-linecap="round"/>
    <circle cx="736" cy="16" r="3" fill="url(#cornerGrad)" opacity="0.6"/>
    <!-- Bottom-left -->
    <path d="M 24 224 L 24 200 M 24 224 L 48 224" stroke-linecap="round"/>
    <circle cx="24" cy="224" r="3" fill="url(#cornerGrad)" opacity="0.6"/>
    <!-- Bottom-right -->
    <path d="M 736 224 L 736 200 M 736 224 L 712 224" stroke-linecap="round"/>
    <circle cx="736" cy="224" r="3" fill="url(#cornerGrad)" opacity="0.6"/>
  </g>

  <!-- Animated border with gradient -->
  <rect x="1" y="1" width="758" height="238" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="1.5" opacity="0.7">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Inner subtle border -->
  <rect x="3" y="3" width="754" height="234" rx="13" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.15"/>

  <!-- Orbiting accent rings -->
  <g transform="translate(380,120)" class="orbit" opacity="0.15">
    <circle r="60" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-dasharray="8,12"/>
    <circle r="90" fill="none" stroke="#facc15" stroke-width="0.5" stroke-dasharray="12,8">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main content area -->
  <g font-family="ui-monospace,'JetBrains Mono','Cascadia Mono',monospace">
    <!-- Command line -->
    <text x="60" y="52" font-size="12" fill="#64748b" letter-spacing="0.3">$ whoami --profile</text>
    
    <!-- Name with shimmer effect -->
    <text x="60" y="94" font-size="36" font-weight="600" fill="url(#textShimmer)">4RYAN<tspan fill="#facc15">-sys</tspan></text>
    
    <!-- Role tag -->
    <g transform="translate(60, 118)">
      <rect x="0" y="-16" width="180" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.4"/>
      <text x="90" y="-2" font-size="11" fill="#22d3ee" text-anchor="middle" letter-spacing="1.2">FULLSTACK &amp; IOT</text>
    </g>

    <!-- Status line with animated cursor -->
    <text x="60" y="150" font-size="13" fill="#8b949e">// SYSTEM </text>
    <text x="152" y="150" font-size="13" fill="#22d3ee" class="pulse">INITIALIZED</text>
    <text x="260" y="150" font-size="13" fill="#8b949e" class="pulse">_</text>

    <!-- Detail lines -->
    <text x="60" y="180" font-size="12" fill="#64748b">▸ focus  <tspan fill="#c9d1d9">Fullstack Web Dev • Solo Dev </tspan></text>
    <text x="60" y="200" font-size="12" fill="#64748b">▸ stack  <tspan fill="#c9d1d9">Next.js • TypeScript • Laravel</tspan></text>
    <text x="60" y="220" font-size="12" fill="#64748b">▸ drive  <tspan fill="#facc15">ship small systems that actually work</tspan></text>
  </g>

  <!-- Floating decorative elements on sides -->
  <g class="float" transform="translate(30, 120)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,6" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="40" r="2" fill="#22d3ee" opacity="0.5"/>
  </g>
  <g class="float" transform="translate(730, 120)" style="animation-delay: 2s;">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#facc15" stroke-width="1" stroke-dasharray="4,6" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="40" r="2" fill="#facc15" opacity="0.5"/>
  </g>

  <!-- Bottom accent bar with shimmer -->
  <rect x="60" y="215" width="200" height="1" rx="0.5" fill="url(#cornerGrad)" opacity="0.5">
    <animate attributeName="width" values="200;280;200" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
